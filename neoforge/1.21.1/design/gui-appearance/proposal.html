<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Proposta — roda e preview</title>
<style>
*{box-sizing:border-box}body{margin:0;height:100vh;display:grid;place-items:center;overflow:hidden;background:#0a1015;color:#edf0f3;font-family:"DejaVu Sans Mono",monospace}body:before{content:"";position:fixed;inset:0;background:linear-gradient(#070c12dc,#080d1466 18%,#080d1466 80%,#070c12dc),url('assets/scene.png') center/cover;filter:brightness(.65) saturate(.65);z-index:-1}.layout{display:grid;grid-template-columns:620px 360px;gap:38px;width:1018px;height:620px;align-items:center;animation:open .21s cubic-bezier(.22,1,.36,1) both}.wheel{width:600px;height:600px;position:relative;background:radial-gradient(circle,#161f29ed 0 115px,#1c2630d9 116px 252px,transparent 253px);border-radius:50%}.track{position:absolute;inset:48px;border:1px solid #ffffff15;border-radius:50%}.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:170px;display:flex;align-items:center;flex-direction:column;gap:20px}.name{font-size:23px;font-weight:500;letter-spacing:-.6px}.navs{display:flex;align-items:center;gap:42px}.nav{background:transparent;border:0;color:#c8d1d9;font:24px "DejaVu Sans Mono";cursor:pointer;padding:4px 8px;transition:color .15s,scale .15s}.nav:hover{color:#f1ce8f;scale:1.08}.slot{position:absolute;width:70px;height:70px;transform:translate(-50%,-50%);border-radius:50%;background:#38434fe6;border:1px solid #ffffff26;display:grid;place-items:center;cursor:pointer;transition:scale .15s cubic-bezier(.22,1,.36,1),background .15s,border-color .15s}.slot.selected,.slot:hover{scale:1.08;background:#eee4d4;border:2px solid #e6c081}.icon{width:49px;height:49px;object-fit:contain;image-rendering:pixelated}.sprite{background-image:url('assets/scuba.png');background-size:1100% 1000%;background-position:0 0;border-radius:3px}.side{height:560px;display:flex;align-items:center;flex-direction:column;justify-content:center;gap:20px}.preview{width:300px;height:350px;position:relative;perspective:900px}.avatar{position:absolute;top:40px;left:50%;width:0;height:0;transform:rotateX(-4deg) rotateY(-22deg);transform-style:preserve-3d}.bone,.cube{position:absolute;transform-style:preserve-3d;transform-origin:0 0 0}.face{position:absolute;display:block;background-image:url('assets/steve.png');image-rendering:pixelated;backface-visibility:hidden}.face.right{filter:brightness(.72)}.face.left{filter:brightness(.86)}.face.top{filter:brightness(1.08)}.face.back{filter:brightness(.65)}.shadow{position:absolute;width:130px;height:20px;left:85px;bottom:22px;border-radius:50%;background:#0007;filter:blur(6px)}#preview-cat{position:absolute;top:2px;left:130px;width:40px;height:40px}.combos{align-self:stretch;font-size:12px;line-height:2.25;color:#d5dde3;letter-spacing:-.1px}.combo{white-space:nowrap}.combo.active{color:#efcf98}@keyframes open{from{opacity:0;scale:.78}to{opacity:1;scale:1}}body.capture .layout{animation:none}@media(max-width:1100px){.layout{scale:.8}}@media(max-height:740px){.layout{scale:.85}}
</style><main class="layout"><div class="wheel" id="wheel"></div><div class="side"><div class="preview"><div class="shadow"></div><div class="avatar"><div id="rig" class="bone"></div></div><div id="preview-cat" class="sprite"></div></div><div class="combos" id="combos"></div></div></main>
<script src="preview-poses.js"></script><script>
const items=[['cheer','Cheer'],['pout','Emburrado'],['angry','Raiva'],['emote_hi','Hi'],['emote_clap','Clap'],['emote_woah','Woah'],['emote_laugh','Risada'],['emote_sad','Choro'],['emote_fear','Medo'],['emote_ew','Ew'],['emote_hearts','Corações'],['emote_angel','Anjo'],['emote_67','67'],['emote_vine_boom','Vine Boom'],['scuba','Scuba']];const query=new URLSearchParams(location.search);const capture=query.has('capture');if(capture)document.body.classList.add('capture');let page=query.get('page')==='2'?1:0;let selected=query.get('selected')||(page?'scuba':'emote_sad');let shift=query.get('shift')==='1';let began=performance.now();let catFrame=0;
function icon(id){return id==='scuba'?'<div class="icon sprite"></div>':`<img class="icon" src="assets/${id}.png" alt="">`}
function render(){const list=items.slice(page*12,page*12+12);if(!list.some(x=>x[0]===selected))selected=list[0][0];const name=items.find(x=>x[0]===selected)[1];let html=`<div class="track"></div><div class="center"><div class="name">${name}</div><div class="navs"><button class="nav" id="prev" aria-label="Anterior">‹</button><button class="nav" id="next" aria-label="Próxima">›</button></div></div>`;list.forEach((item,i)=>{const a=(-90+i*360/list.length)*Math.PI/180;html+=`<button class="slot ${item[0]===selected?'selected':''}" data-id="${item[0]}" style="left:${300+Math.cos(a)*202}px;top:${300+Math.sin(a)*202}px" aria-label="${item[1]}">${icon(item[0])}</button>`});document.getElementById('wheel').innerHTML=html;document.getElementById('combos').innerHTML=selected==='scuba'?`<div class="combo">Esq: dançar</div><div class="combo">Dir: dançar + música</div><div class="combo">Shift + Esq: dançar + gatinho</div><div class="combo ${shift?'active':''}">Shift + Dir: dançar + música + gatinho</div>`:selected==='emote_hi'?'<div class="combo">Esq: Hi</div><div class="combo">Dir: Bye</div>':'<div class="combo">Esq: reproduzir</div>';document.querySelectorAll('.slot').forEach(b=>b.onmouseenter=()=>{if(selected!==b.dataset.id){selected=b.dataset.id;began=performance.now();render()}});document.getElementById('prev').onclick=change;document.getElementById('next').onclick=change;updateCat()}
function change(){page=1-page;selected=page?'scuba':'emote_sad';began=performance.now();render()}
function updateCat(){document.querySelectorAll('.sprite').forEach(el=>{let n=el.clientWidth||49;el.style.backgroundSize=`${11*n}px ${10*n}px`;el.style.backgroundPosition=`${-(catFrame%11)*n}px ${-Math.floor(catFrame/11)*n}px`})}
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();change()}if(e.key==='Shift'){shift=true;render()}});document.addEventListener('keyup',e=>{if(e.key==='Shift'){shift=false;render()}});
</script><script src="player-preview.js"></script><script>makeRig();render();function frame(now){const elapsed=now-began;catFrame=capture?7:Math.floor(elapsed/100)%106;updateCat();preview(selected,elapsed);requestAnimationFrame(frame)}requestAnimationFrame(frame)</script></html>
