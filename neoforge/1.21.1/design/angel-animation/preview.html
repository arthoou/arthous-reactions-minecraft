<!doctype html><html lang="pt-BR"><meta charset="utf-8">
<title>Anjo — preview da animação implementada</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#17212a;color:#cbd5dd;font-family:system-ui,sans-serif}main{width:1200px;height:540px;display:flex;background:radial-gradient(ellipse at 50% 95%,#25333b,#17212a 75%)}.view{position:relative;width:400px;height:540px;perspective:1400px}.label{position:absolute;left:28px;top:24px;font-size:16px;font-weight:450;color:#aebdc7}.avatar{position:absolute;left:200px;top:200px;width:0;height:0;transform-style:preserve-3d;transform:rotateX(-5deg)}.side .avatar{transform:rotateX(-5deg) rotateY(90deg)}.back .avatar{transform:rotateX(-5deg) rotateY(180deg)}.floor{position:absolute;top:432px;left:122px;width:156px;height:17px;background:#080f1580;filter:blur(7px);border-radius:50%}.bone,.cube,.wing-node,.halo{position:absolute;transform-style:preserve-3d;transform-origin:0 0 0}.face{position:absolute;display:block;background-image:url('../gui-appearance/assets/steve.png');image-rendering:pixelated;backface-visibility:hidden}.face.right{filter:brightness(.73)}.face.left{filter:brightness(.88)}.face.top{filter:brightness(1.08)}.face.back{filter:brightness(.78)}.mesh-face{position:absolute;image-rendering:pixelated;transform-origin:0 0}.heart{position:absolute;width:18px;height:18px;image-rendering:pixelated}
</style>
<main><section class="view"><span class="label">Frente</span><div class="floor"></div><div class="avatar"></div></section><section class="view side"><span class="label">Lado</span><div class="floor"></div><div class="avatar"></div></section><section class="view back"><span class="label">Costas</span><div class="floor"></div><div class="avatar"></div></section></main>
<script src="animation-frames.js"></script><script src="model-data.js"></script><script src="preview.js"></script></html>
