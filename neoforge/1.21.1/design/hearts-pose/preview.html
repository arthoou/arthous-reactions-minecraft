<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hearts — proposta de pose</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
body { background: #17212a; color: #e8edf1; font-family: system-ui, sans-serif; }
main { width: 900px; height: 500px; display: flex; margin: auto; background: radial-gradient(ellipse at 50% 95%, #25333b, #17212a 75%); }
.view { position: relative; width: 450px; height: 500px; perspective: 1300px; }
.label { position: absolute; top: 26px; left: 30px; margin: 0; font-size: 16px; font-weight: 450; color: #aebdc7; }
.floor { position: absolute; left: 145px; top: 425px; width: 160px; height: 18px; background: #080f1580; filter: blur(7px); border-radius: 50%; }
.avatar { position: absolute; top: 107px; left: 225px; width: 0; height: 0; transform-style: preserve-3d; transform: rotateX(-5deg) rotateY(25deg); }
.profile .avatar { transform: rotateX(-5deg) rotateY(78deg); }
.bone, .cube { position: absolute; transform-style: preserve-3d; transform-origin: 0 0 0; }
.face { position: absolute; display: block; background-image: url('../gui-appearance/assets/steve.png'); image-rendering: pixelated; backface-visibility: hidden; }
.face.right { filter: brightness(.73); } .face.left { filter: brightness(.88); }
.face.top { filter: brightness(1.08); } .face.bottom { filter: brightness(.65); } .face.back { filter: brightness(.78); }
.heart { position: absolute; width: 22px; height: 22px; image-rendering: pixelated; transform-origin: center; }
</style>
<main>
  <section class="view"><p class="label">Frente</p><div class="floor"></div><div class="avatar" id="front"></div></section>
  <section class="view profile"><p class="label">Lado direito</p><div class="floor"></div><div class="avatar" id="side"></div></section>
</main>
<script src="hearts-pose.js"></script>
</html>
