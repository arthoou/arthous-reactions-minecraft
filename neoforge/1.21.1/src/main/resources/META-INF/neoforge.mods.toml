modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="icon.png"
authors="${mod_authors}"
displayTest="IGNORE_ALL_VERSION"

description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[mixins]]
config="arthousreactions.mixins.json"

[[dependencies.${mod_id}]]
modId="skinlayers3d"
type="optional"
versionRange="[1.11.4,)"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="playeranimator"
type="required"
versionRange="[2.0.4+1.21.1,2.1)"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="bendylib"
type="required"
versionRange="[5.1,6.0)"
ordering="AFTER"
side="CLIENT"
